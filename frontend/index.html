<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aab-e-Panah</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main>
        <p id="status">Checking database...</p>
        <h1>Aab-e-Panah</h1>

        <form id="camp-form">
            <label for="camp-name">Camp name</label>
            <input id="camp-name" name="name" type="text" required>

            <label for="district">District</label>
            <input id="district" name="district" type="text" required>

            <label for="capacity">Capacity</label>
            <input id="capacity" name="capacity" type="number" min="1" step="1" required>

            <button type="submit">Add Camp</button>
        </form>

        <p id="message"></p>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>District</th>
                    <th>Capacity</th>
                    <th>Current occupancy</th>
                </tr>
            </thead>
            <tbody id="camp-list"></tbody>
        </table>

        <section>
            <h2>Aid Requests</h2>
            <form id="request-form">
                <label for="area-name">Area name</label>
                <input id="area-name" name="area_name" type="text" required>

                <label for="needs">Needs</label>
                <input id="needs" name="needs" type="text" required>

                <label for="severity">Severity</label>
                <select id="severity" name="severity">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button type="submit">Add Request</button>
            </form>
            <button id="serve-request" type="button">Serve next request</button>
            <p id="request-message"></p>

            <h3>Waiting requests</h3>
            <table>
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Area</th>
                        <th>Needs</th>
                        <th>Severity</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="request-list"></tbody>
            </table>

            <h3>Recently served requests</h3>
            <table>
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>Needs</th>
                        <th>Severity</th>
                        <th>Served time</th>
                    </tr>
                </thead>
                <tbody id="served-list"></tbody>
            </table>
        </section>
    </main>
    <script src="/static/js/camps.js"></script>
    <script src="/static/js/aid_requests.js"></script>
</body>
</html>
